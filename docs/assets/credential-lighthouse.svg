<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"
     aria-labelledby="title desc" width="640" height="340">
  <title id="title">passkeypier verification checkpoint</title>
  <desc id="desc">A harbor lighthouse acting as a checkpoint. A credential arriving
    from the water passes five verification gates (origin, challenge, RP ID hash,
    signature, counter) before it is allowed to dock.</desc>

  <rect width="640" height="340" fill="#0c1b2a"/>
  <rect y="238" width="640" height="102" fill="#10293e"/>

  <!-- sweep line, rotates once to show the checkpoint scanning; motion communicates the active verify pass -->
  <g transform="translate(470 118)">
    <line x1="0" y1="0" x2="-300" y2="0" stroke="#f2b134" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="-26;24;-26" dur="7s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </line>
  </g>

  <!-- lighthouse tower, flat -->
  <g>
    <polygon points="452,238 488,238 481,120 459,120" fill="#e8eff5"/>
    <rect x="459" y="200" width="22" height="16" fill="#c0392b"/>
    <rect x="461" y="164" width="18" height="14" fill="#c0392b"/>
    <rect x="459" y="104" width="22" height="16" fill="#163049" stroke="#2e5a80"/>
    <polygon points="456,104 484,104 470,90" fill="#2e5a80"/>
    <rect x="466" y="108" width="8" height="8" fill="#f2b134"/>
  </g>

  <!-- incoming credential ship -->
  <g transform="translate(70 250)">
    <path d="M-22 0 h44 l-8 14 h-28 Z" fill="#e8eff5"/>
    <rect x="-2" y="-24" width="4" height="24" fill="#3ddc97"/>
    <polygon points="2,-24 2,-6 22,-15" fill="#3ddc97"/>
    <animateTransform attributeName="transform" type="translate"
      values="70 250;92 250;70 250" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- verification gate ladder -->
  <g font-family="monospace" font-size="13" fill="#cfe0ee">
    <g transform="translate(150 60)">
      <rect width="220" height="26" rx="3" fill="#163049" stroke="#2e5a80"/>
      <rect width="6" height="26" fill="#3ddc97"/>
      <text x="16" y="18">1 origin match</text>
    </g>
    <g transform="translate(150 94)">
      <rect width="220" height="26" rx="3" fill="#163049" stroke="#2e5a80"/>
      <rect width="6" height="26" fill="#3ddc97"/>
      <text x="16" y="18">2 challenge equality</text>
    </g>
    <g transform="translate(150 128)">
      <rect width="220" height="26" rx="3" fill="#163049" stroke="#2e5a80"/>
      <rect width="6" height="26" fill="#3ddc97"/>
      <text x="16" y="18">3 RP ID hash</text>
    </g>
    <g transform="translate(150 162)">
      <rect width="220" height="26" rx="3" fill="#163049" stroke="#2e5a80"/>
      <rect width="6" height="26" fill="#3ddc97"/>
      <text x="16" y="18">4 Ed25519 signature</text>
    </g>
    <g transform="translate(150 196)">
      <rect width="220" height="26" rx="3" fill="#163049" stroke="#2e5a80"/>
      <rect width="6" height="26" fill="#3ddc97"/>
      <text x="16" y="18">5 counter advanced</text>
    </g>
  </g>
