<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img"
     aria-labelledby="ct cd" width="700" height="320">
  <title id="ct">passkeypier ceremony data flow</title>
  <desc id="cd">Data flow between the relying party and the virtual authenticator.
    The relying party issues a random challenge, the authenticator returns
    authenticator data plus an Ed25519 signature over authData and the client
    data hash, and the relying party verifies it.</desc>

  <rect width="700" height="320" fill="#0c1b2a"/>

  <!-- relying party -->
  <g>
    <rect x="36" y="80" width="180" height="150" rx="8" fill="#163049" stroke="#2e5a80" stroke-width="2"/>
    <text x="126" y="112" text-anchor="middle" fill="#e8eff5" font-family="monospace" font-size="16">Relying Party</text>
    <text x="126" y="134" text-anchor="middle" fill="#89a4bb" font-family="monospace" font-size="11">harbor.example</text>
    <line x1="60" y1="148" x2="192" y2="148" stroke="#2e5a80"/>
    <text x="126" y="172" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">issues challenge</text>
    <text x="126" y="192" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">verifies assertion</text>
    <text x="126" y="212" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">stores public key</text>
  </g>

  <!-- authenticator -->
  <g>
    <rect x="484" y="80" width="180" height="150" rx="8" fill="#163049" stroke="#2e5a80" stroke-width="2"/>
    <text x="574" y="112" text-anchor="middle" fill="#e8eff5" font-family="monospace" font-size="16">Authenticator</text>
    <text x="574" y="134" text-anchor="middle" fill="#89a4bb" font-family="monospace" font-size="11">resident credential</text>
    <line x1="508" y1="148" x2="640" y2="148" stroke="#2e5a80"/>
    <text x="574" y="172" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">holds Ed25519 key</text>
    <text x="574" y="192" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">bumps sign counter</text>
    <text x="574" y="212" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="11">signs the message</text>
  </g>

  <!-- outbound challenge -->
  <line x1="220" y1="128" x2="480" y2="128" stroke="#3ddc97" stroke-width="2.5"
        stroke-dasharray="8 6" marker-end="url(#a)">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <text x="350" y="118" text-anchor="middle" fill="#3ddc97" font-family="monospace" font-size="12">challenge: 32 random bytes</text>

  <!-- inbound assertion -->
  <line x1="480" y1="182" x2="220" y2="182" stroke="#f2b134" stroke-width="2.5"
        stroke-dasharray="8 6" marker-end="url(#b)">
    <animate attributeName="stroke-dashoffset" values="0;28" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <text x="350" y="204" text-anchor="middle" fill="#f2b134" font-family="monospace" font-size="12">authData + Ed25519 signature</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3ddc97"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f2b134"/>
    </marker>
  </defs>

  <!-- signed message construction -->
  <g transform="translate(140 250)">
    <rect width="420" height="44" rx="6" fill="#10293e" stroke="#2e5a80"/>
    <text x="210" y="20" text-anchor="middle" fill="#cfe0ee" font-family="monospace" font-size="12">signed message</text>
    <text x="210" y="36" text-anchor="middle" fill="#e8eff5" font-family="monospace" font-size="12">authenticatorData || SHA-256(clientDataJSON)</text>
  </g>

  <text x="36" y="40" fill="#e8eff5" font-family="monospace" font-size="15">webauthn.create registers, webauthn.get authenticates</text>
</svg>

// draft note 13
